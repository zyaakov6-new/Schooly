name: family_os
description: FamilyOS - One app for all your kids. Zero chaos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  firebase_storage: ^12.1.3
  google_sign_in: ^6.2.1

  # UI & Animations
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Calendar
  table_calendar: ^3.1.2

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  url_launcher: ^6.3.0
  uuid: ^4.4.2
  go_router: ^14.2.7
  google_fonts: ^6.2.1

  # Glassmorphism
  glass_kit: ^3.0.0

  # Icons
  flutter_svg: ^2.0.10+1
  iconsax: ^0.0.8

  # Misc
  confetti: ^0.7.0
  flutter_slidable: ^3.1.1
  reorderable_grid_view: ^2.2.8
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
